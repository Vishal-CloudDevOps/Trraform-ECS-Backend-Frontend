name: Deploy Angular App to ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # 👈 allows manual trigger from GitHub UI

permissions:
  contents: read       # 👈 required to checkout code
  id-token: write      # 👈 required for OIDC authentication

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Configure AWS credentials via OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::762687106929:role/OIDC_Role_GitHubActions
          aws-region: ap-south-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, tag, and push Docker image
      - name: Build, Tag, and Push Docker Image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/angular-app:latest
          echo "Building Docker image: $IMAGE_URI"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/angular-app:latest

      # 5. Render ECS task definition with new image
      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-def.json
          container-name: angular-container
          image: ${{ steps.login-ecr.outputs.registry }}/angular-app:latest

      # 6. Deploy to ECS
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: angular-service
          cluster: angular-cluster
          wait-for-service-stability: true
